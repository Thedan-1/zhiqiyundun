<div class="card">
    <div class="panel-title">
        <i class="fas fa-history"></i> 历史记录
    </div>
    <div class="card-content">
        <div class="form-group">
            <label for="historySearchInput"><i class="fas fa-search"></i> 搜索公司名称</label>
            <input type="text" id="historySearchInput" placeholder="输入公司名称">
        </div>
        <table class="table risk-table">
            <thead>
                <tr>
                    <th>公司名称</th>
                    <th>风险等级</th>
                    <th>评估时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="historyRecordsTableBody" data-history-type="{{ request.endpoint }}">
                <!-- History records will be loaded here by JavaScript -->
                <tr><td colspan="4" style="text-align: center; color: #a3c3ff;">暂无历史记录</td></tr>
            </tbody>
        </table>
    </div>
</div>
