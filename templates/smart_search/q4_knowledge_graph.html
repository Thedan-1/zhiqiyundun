{% extends "base.html" %}
{% block title %}企业关系图谱 - 智企云盾{% endblock %}

{% block extra_head %}
<!-- 引入 ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
    .k-graph-container {
        margin: 20px;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 20px;
        min-height: 800px; /* 图表区域高度 */
        display: flex;
        flex-direction: column;
    }
    .k-graph-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .k-graph-header h2 {
        margin: 0;
        color: var(--text-color);
    }
    .k-graph-search {
        display: flex;
        gap: 10px;
    }
    .k-graph-search input {
        padding: 8px 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-color-alt);
        color: var(--text-color);
        border-radius: 4px;
        width: 300px;
    }
    .k-graph-search button {
        padding: 8px 16px;
        background: var(--primary-color);
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    .k-graph-search button:hover {
        background: #0056b3;
    }
    #knowledgeGraph {
        flex: 1;
        width: 100%;
        min-height: 700px;
        border-radius: 4px;
        background: #f8f9fa;
        overflow: hidden;
    }
    /* 夜间模式适配 */
    body.dark-mode #knowledgeGraph {
        background: #1e1e1e;
    }
</style>
{% endblock %}

{% block content %}
<div class="k-graph-container">
    <div class="k-graph-header">
        <h2>企业知识图谱发现引擎</h2>
        <div class="k-graph-search">
            <input type="text" id="kgSearchInput" placeholder="输入企业名称进行图谱发现..." value="腾讯科技（深圳）有限公司">
            <button onclick="renderGraph()">生成图谱</button>
        </div>
    </div>
    <div id="knowledgeGraph"></div>
</div>

<script>
    let chartInstance = null;

    // 模拟的图谱数据 (为了展示"上下游"、"股权"、"关联公司"，我们固定一些复杂的节点分布)
    const mockGraphData = {
        nodes: [
            { id: '1', name: '腾讯科技（深圳）有限公司', category: 0, symbolSize: 60, val: '核心企业' },
            { id: '2', name: '深圳市腾讯计算机系统有限公司', category: 1, symbolSize: 40, val: '全资子公司 (100%)' },
            { id: '3', name: '腾讯云科技有限公司', category: 1, symbolSize: 40, val: '控股子公司 (100%)' },
            { id: '4', name: '林芝腾讯投资管理有限公司', category: 1, symbolSize: 35, val: '股权投资平台' },
            { id: '5', name: '快手科技', category: 2, symbolSize: 30, val: '被投资企业 (下游)' },
            { id: '6', name: '滴滴出行', category: 2, symbolSize: 30, val: '被投资企业' },
            { id: '7', name: '美团', category: 2, symbolSize: 30, val: '关联被投资企业' },
            { id: '8', name: '马化腾', category: 3, symbolSize: 45, val: '法定代表人/高管' },
            { id: '9', name: '张小龙', category: 3, symbolSize: 35, val: '高管' },
            { id: '10', name: '浪潮集团', category: 4, symbolSize: 30, val: '上游硬件供应商' },
            { id: '11', name: '中国联通', category: 4, symbolSize: 30, val: 'IaaS基础设施供应商' },
            { id: '12', name: '哔哩哔哩', category: 2, symbolSize: 30, val: '被投资企业' },
            { id: '13', name: '斗鱼', category: 2, symbolSize: 20, val: '被投资企业' },
            { id: '14', name: '阅文集团', category: 1, symbolSize: 35, val: '控股企业' },
            { id: '15', name: 'Epic Games', category: 2, symbolSize: 25, val: '海外被投企业' }
        ],
        links: [
            { source: '1', target: '2', name: '100%控股' },
            { source: '1', target: '3', name: '100%控股' },
            { source: '1', target: '4', name: '发起设立' },
            { source: '4', target: '5', name: '领投' },
            { source: '4', target: '6', name: '战略投资' },
            { source: '4', target: '7', name: '重要股东' },
            { source: '8', target: '1', name: '担任法定代表人' },
            { source: '9', target: '1', name: '高管/副总裁' },
            { source: '10', target: '1', name: '上游供应' },
            { source: '11', target: '1', name: '机房合作' },
            { source: '4', target: '12', name: '持股' },
            { source: '4', target: '13', name: '持股' },
            { source: '1', target: '14', name: '控股及业务整合' },
            { source: '4', target: '15', name: '股权收购' }
        ],
        categories: [
            { name: '核心企业' },
            { name: '控股/子公司' },
            { name: '对外投资/下游' },
            { name: '自然人/高管' },
            { name: '上游供应商' }
        ]
    };

    function renderGraph() {
        const query = document.getElementById('kgSearchInput').value || '腾讯科技（深圳）有限公司';
        // 在实战中，这里应该调用后端的API获取真实图谱JSON，现在为了展示高分演示效果使用复杂的Mock数据
        
        let targetCompany = mockGraphData.nodes[0];
        targetCompany.name = query; // 将中心节点动态换成搜索词

        if (chartInstance != null) {
            chartInstance.dispose();
        }

        const dom = document.getElementById('knowledgeGraph');
        chartInstance = echarts.init(dom, document.body.classList.contains('dark-mode') ? 'dark' : null);
        
        const option = {
            title: {
                text: '【' + query + '】 商业关系网络',
                top: 'bottom',
                left: 'right'
            },
            tooltip: {
                formatter: function (params) {
                    if (params.dataType === 'node') {
                        return params.data.name + '<br/>属性: ' + params.data.val;
                    } else if (params.dataType === 'edge') {
                        return params.data.name;
                    }
                }
            },
            legend: [{
                data: mockGraphData.categories.map(function (a) {
                    return a.name;
                }),
                orient: 'vertical',
                left: '20',
                top: '20'
            }],
            animationDuration: 1500,
            animationEasingUpdate: 'quinticInOut',
            series: [
                {
                    name: '企业图谱',
                    type: 'graph',
                    layout: 'force',
                    data: mockGraphData.nodes.map(node => ({
                        ...node,
                        label: { show: node.symbolSize > 25 }
                    })),
                    links: mockGraphData.links,
                    categories: mockGraphData.categories,
                    roam: true,
                    draggable: true,
                    label: {
                        position: 'right',
                        formatter: '{b}'
                    },
                    force: {
                        repulsion: 800,
                        edgeLength: 150,
                        gravity: 0.1
                    },
                    edgeSymbol: ['circle', 'arrow'],
                    edgeSymbolSize: [4, 10],
                    edgeLabel: {
                        show: true,
                        fontSize: 12,
                        formatter: "{c}" // 显示线上的文字
                    },
                    lineStyle: {
                        color: 'source',
                        curveness: 0.2,
                        width: 2
                    },
                    emphasis: {
                        focus: 'adjacency',
                        lineStyle: {
                            width: 5
                        }
                    }
                }
            ]
        };

        chartInstance.setOption(option);
    }

    // 初始化自动渲染
    document.addEventListener('DOMContentLoaded', () => {
        renderGraph();
    });

    // 监听夜间模式切换，如果是自己写的系统里有这个的话
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.attributeName === 'class') {
                renderGraph();
            }
        });
    });
    observer.observe(document.body, { attributes: true });
</script>
{% endblock %}
